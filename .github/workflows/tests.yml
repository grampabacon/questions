name: Run Solutions

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run all Python solutions
        run: |
          find . -name "solution.py" -print -exec python3 {} \;

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run all JavaScript solutions
        run: |
          find . -name "solution.js" -print -exec node {} \;

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install tsx
        run: npm install -g tsx
      - name: Run all TypeScript solutions
        run: |
          find . -name "solution.ts" | while read -r f; do
            echo "Running $f"
            tsx "$f"
          done

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Run all Go solutions
        run: |
          find . -name "solution.go" | while read -r f; do
            echo "Running $f"
            go run "$f"
          done

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install dotnet-script
        run: dotnet tool install -g dotnet-script
      - name: Run all C# solutions
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          find . -name "solution.cs" | while read -r f; do
            echo "Running $f"
            dotnet script "$f"
          done
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Run all Java solutions
        run: |
          find . -name "solution.java" | while read -r f; do
            echo "Running $f"
            java "$f"
          done

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - uses: fwilhe2/setup-kotlin@v2
      - name: Run all Kotlin solutions
        run: |
          find . -name "solution.kt" | while read -r f; do
            echo "Running $f"
            jar="$(mktemp -t kotlin-solution).jar"
            kotlinc "$f" -include-runtime -d "$jar"
            java -jar "$jar"
            rm -f "$jar"
          done
